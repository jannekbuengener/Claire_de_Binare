# README link validation policy (#3994, extended #4037, #4124, #4298)
#
# Discovery: git ls-files '**/README.md' (automatic, fail-closed for new files)
# This fixture holds classification rules, explicit active non-README surfaces,
# documented exceptions, and the Area Entry Link Rule machine contract.
# Canon SSOT: docs/meta/REPOSITORY_CANON.md § Area Entry Link Rule.

version: 1
issue: 3994
follow_up_issue: 4298

# Unmatched README paths use this class and are validated (fail-closed).
default_classification: active

classification_rules:
  archive_snapshot:
    description: Historical snapshots; link integrity not enforced (#3994).
    path_prefixes:
      - docs/archive/
      - knowledge/archive/
  fixture_testdata:
    description: Test fixtures and generated evidence trees; out of nav scope.
    path_prefixes:
      - tests/fixtures/
      - artifacts/
      - docs/evidence/reports/p5_canary/

# Non-README canon entry points — same offline link rules as active READMEs.
# Discovery is explicit; every path must stay tracked in git.
explicit_active_surfaces:
  description: >-
    Active navigation, status, operational, strategy, environment, test, and
    metric surfaces outside README.md trees; validated by the same link engine.
  paths:
    - CURRENT_STATUS.md
    - docs/runbooks/CONTROL_REGISTER.md
    - docs/meta/REPOSITORY_CANON.md
    - knowledge/CDB_KNOWLEDGE_HUB.md
    - docs/index.md
    - DEVELOPER_ONBOARDING.md
    - docs/onboarding/cdb_glossary.md
    - docs/onboarding/DEVELOPER_VISUAL_START_HERE.md
    - docs/onboarding/repo_brain_context_intelligence.md
    - docs/strategy/CDB_STRATEGIC_IDEA_LAB.md
    - docs/env/index.md
    - infrastructure/compose/TEST_OVERLAY_README.md
    - infrastructure/monitoring/METRICS_MATRIX.md

# Explicit per-path overrides (use sparingly).
documented_exceptions: []

# Executable mirror of REPOSITORY_CANON.md § Area Entry Link Rule / index hubs.
# Invalid entries fail closed at policy load (missing fields, duplicates,
# missing entrypoints, entrypoints outside directory, absolute/external paths).
area_entry_link_rule:
  enabled: true
  established_index_hubs:
    - directory: docs
      entrypoint: docs/index.md
    - directory: docs/ci
      entrypoint: docs/ci/index.md
    - directory: docs/db
      entrypoint: docs/db/index.md
    - directory: docs/env
      entrypoint: docs/env/index.md
    - directory: docs/external-docs
      entrypoint: docs/external-docs/index.md
