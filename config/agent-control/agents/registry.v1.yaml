schema_id: cdb.agent_registry.v1
schema_version: "1.0.0"
# Desired-state agent registry for the CDB Agent Control Plane (#4252).
# Profiles are loaded from ../profiles/. This file is provider-neutral Desired
# State only; reconcile defaults to dry-run and never mutates live providers.
agents:
  - agent_id: acp-docs-steward
    version: "1.0.0"
    enabled: true
    description: Docs/governance delivery agent for Agent Control Plane slices.
    execution_contract_profile: docs_only.v1
    provider_profile: mock.v1
    environment_profile: local_repo.v1
    skills:
      - governance_docs.v1
    mcp_profiles:
      - none.v1
    subagents:
      - cdb-docs-canon-maintainer
      - cdb-governance-gatekeeper
    labels_or_routing_selectors:
      lane: agent-skills
      batch_key: agent-skills
      objective: issue-4252
    depends_on: []
    permission_overrides:
      open_pr: false
      merge: false

  - agent_id: acp-registry-reconciler
    version: "1.0.0"
    enabled: true
    description: Registry validate/plan/reconcile operator (CLI-only, dry-run default).
    execution_contract_profile: delivery_safe.v1
    provider_profile: mock.v1
    environment_profile: mock.v1
    skills:
      - session_core.v1
    mcp_profiles:
      - none.v1
    subagents: []
    labels_or_routing_selectors:
      lane: agent-skills
      role: registry-reconciler
    depends_on:
      - acp-docs-steward

  - agent_id: acp-disabled-placeholder
    version: "1.0.0"
    enabled: false
    description: Disabled placeholder; must never be planned as create/update.
    execution_contract_profile: docs_only.v1
    provider_profile: mock.v1
    environment_profile: mock.v1
    skills:
      - session_core.v1
    mcp_profiles:
      - none.v1
    subagents: []
    labels_or_routing_selectors:
      lane: agent-skills
      role: disabled-placeholder
    depends_on: []

  - agent_id: acp-mock-dispatcher
    version: "1.0.0"
    enabled: true
    description: >
      Mock-only governed dispatcher agent for #4253. Never live-dispatches;
      provider_profile remains mock.v1.
    execution_contract_profile: delivery_safe.v1
    provider_profile: mock.v1
    environment_profile: mock.v1
    skills:
      - session_core.v1
    mcp_profiles:
      - none.v1
    subagents: []
    labels_or_routing_selectors:
      lane: agent-skills
      batch_key: agent-skills
      role: mock-dispatcher
      objective: issue-4253
    depends_on:
      - acp-registry-reconciler
    permission_overrides:
      merge: false
      publish_cdb_local_ci: false
      close_issue: false
      runtime_mutation: false
      database_mutation: false
      mcp_live_mutation: false

  - agent_id: acp-e2e-pilot
    version: "1.0.0"
    enabled: true
    description: >
      Mock-first ACP E2E foundation pilot agent for #4258. Uses MockProvider only;
      environment mock-pilot.v1 for timeout attenuation. Never live-dispatches.
      Does not close #4258 (Live-Cursor rest remains open).
    execution_contract_profile: delivery_safe.v1
    provider_profile: mock.v1
    environment_profile: mock-pilot.v1
    skills:
      - session_core.v1
    mcp_profiles:
      - none.v1
    subagents: []
    labels_or_routing_selectors:
      lane: agent-skills
      batch_key: agent-skills
      role: e2e-pilot
      objective: issue-4258
    depends_on:
      - acp-mock-dispatcher
    permission_overrides:
      merge: false
      publish_cdb_local_ci: false
      close_issue: false
      open_pr: false
      runtime_mutation: false
      database_mutation: false
      mcp_live_mutation: false

  - agent_id: acp-cursor-sdk-adapter
    version: "1.0.0"
    enabled: true
    description: >
      Cursor SDK adapter agent for #4254/#4255. Provider profile live_dispatch=false;
      governed environment profile cdb-agent-skills.v1; real Cursor live dispatch remains forbidden.
    execution_contract_profile: delivery_safe.v1
    provider_profile: cursor-sdk.v1
    environment_profile: cdb-agent-skills.v1
    skills:
      - session_core.v1
    mcp_profiles:
      - none.v1
    subagents: []
    labels_or_routing_selectors:
      lane: agent-skills
      batch_key: agent-skills
      role: cursor-sdk-adapter
      objective: issue-4255
    depends_on:
      - acp-mock-dispatcher
    permission_overrides:
      merge: false
      publish_cdb_local_ci: false
      close_issue: false
      open_pr: false
      runtime_mutation: false
      database_mutation: false
      mcp_live_mutation: false

  - agent_id: acp-live-cursor-pilot
    version: "1.0.0"
    enabled: true
    description: >
      Human-GO live Cursor cloud pilot agent for #4258. Provider cursor-cloud-api.v1
      with environment cursor-live-pilot.v1 (runtime_class mock for CI doctor).
      Live execute requires explicit Human-GO flags; never merges or closes #4258.
    execution_contract_profile: delivery_safe.v1
    provider_profile: cursor-cloud-api.v1
    environment_profile: cursor-live-pilot.v1
    skills:
      - session_core.v1
    mcp_profiles:
      - none.v1
    subagents: []
    labels_or_routing_selectors:
      lane: agent-skills
      batch_key: agent-skills
      role: live-cursor-pilot
      objective: issue-4258
    depends_on:
      - acp-e2e-pilot
    permission_overrides:
      merge: false
      publish_cdb_local_ci: false
      close_issue: false
      open_pr: false
      runtime_mutation: false
      database_mutation: false
      mcp_live_mutation: false

  - agent_id: acp-jules-api-adapter
    version: "1.0.0"
    enabled: true
    description: >
      Jules REST v1alpha adapter for #4461. Reuses the existing provider-neutral
      ACP lifecycle and adds explicit plan approval, Activities, follow-up and
      PR/result handoff. Jules never gains merge, final-CI or runtime authority.
    execution_contract_profile: jules_delivery_safe.v1
    provider_profile: jules-api.v1
    environment_profile: local_repo.v1
    skills:
      - session_core.v1
      - jules_dispatch.v1
    mcp_profiles:
      - none.v1
    subagents: []
    labels_or_routing_selectors:
      lane: agent-skills
      batch_key: agent-skills
      role: jules-api-adapter
      objective: issue-4461
    depends_on:
      - acp-mock-dispatcher
    permission_overrides:
      merge: false
      publish_cdb_local_ci: false
      close_issue: false
      runtime_mutation: false
      database_mutation: false
      mcp_live_mutation: false
