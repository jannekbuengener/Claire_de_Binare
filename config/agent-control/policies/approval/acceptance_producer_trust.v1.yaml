# Acceptance producer trust policy (#4505)
# Schema-valid envelope JSON alone does NOT authorize approval.
# Trust derives from GitHub comment actor metadata, not self-declared producer.
version: "1.0.0"
policy_id: cdb.acceptance_producer_trust.v1
fail_closed: true
producers:
  cdb-batch-merge-conductor:
    trusted_github_app_slugs:
      - cdb-local-ci
    trusted_author_logins: []
    allowed_author_types:
      - Bot
    require_performed_via_github_app: true
  cdb-pr-completeness-review:
    trusted_github_app_slugs:
      - cdb-local-ci
    trusted_author_logins: []
    allowed_author_types:
      - Bot
    require_performed_via_github_app: true
  cdb-protection-live-attestation:
    trusted_github_app_slugs:
      - cdb-local-ci
    trusted_author_logins: []
    allowed_author_types:
      - Bot
    require_performed_via_github_app: true
