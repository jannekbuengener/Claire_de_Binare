profile_id: delivery_safe.v1
description: >
  Delivery-safe execution-contract ceiling. Merge, cdb-local-ci publish, and
  runtime/DB/MCP mutations remain false. Registry entries may only reduce these
  permissions further.
permissions:
  read_repo: true
  write_code: true
  write_docs: true
  commit: true
  push: true
  open_pr: false
  update_pr: true
  comment_issue: true
  close_issue: false
  publish_cdb_local_ci: false
  merge: false
  runtime_mutation: false
  database_mutation: false
  mcp_live_mutation: false
