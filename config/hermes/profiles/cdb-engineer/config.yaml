# Non-secret config for cdb-engineer (#4289 / #4501)
profile:
  name: cdb-engineer
  class: engineering

security:
  redact_secrets: true
  tirith_enabled: true
  tirith_fail_open: false

approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  deny:
    - "git push --force*"
    - "git push -f*"
    - "gh pr merge *--admin*"
    - "gh api *branch-protection*"
    - "gh secret *"
    - "*cdb-local-ci*"
    - "make ci-local-publish*"
    - "python -m ci.publisher *"

terminal:
  # Prefer isolated backend; SSH to Windows only via dedicated user + allowlist.
  backend: docker
  cwd: /workspace
  home_mode: profile

# Optional SSH backend (operator-enabled) must target hermes-win + workspace only.
ssh_targets:
  windows_workspace:
    enabled: false
    user: hermes-win
    # Host is Tailscale MagicDNS / private IP — never a public SSH port.
    host_env: HERMES_WINDOWS_TAILSCALE_HOST
    allow_paths:
      - "D:\\Dev\\HermesWorkspace\\Claire_de_Binare"  # pragma: allowlist secret
    deny_paths:
      - "C:\\Users"
      - "D:\\"
      - "C:\\"

github:
  auth_mode: app_installation_token
  token_broker: python -m tools.hermes_ops mint-token --profile cdb-engineer --token-file /run/hermes/cdb-engineer/token
  linux_user: hermes-cdb-engineer
  credential_env:
    - HERMES_GH_APP_ID
    - HERMES_GH_APP_INSTALLATION_ID
    - HERMES_GH_APP_PRIVATE_KEY_PATH
  allowed_repositories:
    - jannekbuengener/Claire_de_Binare  # pragma: allowlist secret
  forbidden_actions:
    - publish_cdb_local_ci
    - admin_merge
    - edit_branch_protection
    - read_or_write_repo_secrets
    - force_push
    - delete_default_branch
    - expand_app_permissions

server:
  host: 127.0.0.1
  port: 9120
  require_auth_non_loopback: true

# ---------------------------------------------------------------------------
# Inference (#4501) — Hermes Agent v0.19.1 schema only
# Fields verified against pinned DEFAULT_CONFIG / cli-config.yaml.example
# (NousResearch/hermes-agent@cc4cab2f592e60a197e796506de9168f74baf3ea):
#   model.provider, model.default, fallback_providers, auxiliary.<task>.provider
# Primary: openai-codex (ChatGPT/Codex OAuth). No paid API-key fallback.
# OAuth/subscription unavailable => fail closed (empty fallback_providers).
# Auxiliary uses "codex" (v0.19.1 alias of openai-codex), not "auto".
# ---------------------------------------------------------------------------
model:
  provider: openai-codex
  default: gpt-5.4

fallback_providers: []

auxiliary:
