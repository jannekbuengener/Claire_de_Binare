  skills_hub:
    provider: codex
  approval:
    provider: codex
  mcp:
    provider: codex
  title_generation:
    provider: codex
  memory_query_rewrite:
    provider: codex
  tts_audio_tags:
    provider: codex
  triage_specifier:
    provider: codex
  kanban_decomposer:
    provider: codex
  profile_describer:
    provider: codex
  goal_judge:
    provider: codex
  curator:
    provider: codex
  monitor:
    provider: codex
  background_review:
    provider: codex
  moa_reference:
    provider: codex
  moa_aggregator:
