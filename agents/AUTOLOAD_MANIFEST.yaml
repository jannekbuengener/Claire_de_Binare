# Canonical machine-readable agent autoload manifest (#4118)
version: "2.0"
canonical_onboarding: agents/agent_orga/AGENT_ONBOARDING.md
registry: agents/AGENTS.md

shared:
  must_read:
    - knowledge/governance/CDB_CONSTITUTION.md
    - knowledge/governance/CDB_GOVERNANCE.md
    - knowledge/governance/CDB_AGENT_POLICY.md
    - knowledge/governance/SYSTEM_INVARIANTS.md
    - docs/meta/REPOSITORY_CANON.md
    - CURRENT_STATUS.md
    - docs/live-readiness/LR-AUDIT-STATUS-2026-03-05.md
    - docs/runbooks/CONTROL_REGISTER.md
    - agents/OPEN_CODE_AGENTS.md
  historical_reference:
    - knowledge/CDB_KNOWLEDGE_HUB.md

user_authority:
  owner: Jannek
  principle: KI ist Werkzeug, nicht Betreiber
  on_conflict: STOP_AND_ESCALATE
  user_overrides_all: true

agents:
  claude:
    role_file: agents/CLAUDE.md
  codex:
    role_file: agents/roles/CODEX.md
  copilot:
    role_file: agents/COPILOT.md
  gemini:
    role_file: agents/GEMINI.md

context_bridge:
  source: tools.mcp.context_bridge.create_bridge
  expected_tool_count: 27

validation:
  on_missing_must_read: STOP
  on_missing_role_file: STOP
  on_tool_count_mismatch: STOP
