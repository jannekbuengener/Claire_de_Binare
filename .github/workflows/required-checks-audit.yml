# .github/workflows/required-checks-audit.yml
name: required-checks-audit (Sentinel)

on:
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  statuses: read
  pull-requests: read

concurrency:
  group: required-checks-audit-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    name: required-checks-audit (Sentinel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Audit required check status
        shell: bash
        run: |
          set -u

          deadline=$((SECONDS + 780))
          sleep_seconds=10
          summary_file="${GITHUB_STEP_SUMMARY:-}"
          required_check="cdb-local-ci"
          required_type="commit_status"

          echo "Sentinel mode: audit-only"
          echo "SHA: $SHA"
          echo "Required context: $required_check"
          echo "Required type: $required_type"

          final_state=""
          final_detail=""
          while true; do
            if ! status_json="$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/commits/$SHA/status" 2>&1)"; then
              echo "::warning::Combined Commit Status read failed: $status_json"
              if [[ $SECONDS -ge $deadline ]]; then
                final_state="TIMEOUT"
                final_detail="Commit Status API failed until deadline"
                break
              fi
              sleep "$sleep_seconds"
              continue
            fi

            if ! check_runs_json="$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/commits/$SHA/check-runs?per_page=100" 2>&1)"; then
              echo "::warning::Check Runs read failed: $check_runs_json"
              if [[ $SECONDS -ge $deadline ]]; then
                final_state="TIMEOUT"
                final_detail="Check Runs API failed until deadline"
                break
              fi
              sleep "$sleep_seconds"
              continue
            fi

            commit_status="$(
              jq -c --arg n "$required_check" \
                '[.statuses[] | select(.context == $n)] |
                 sort_by(.updated_at // .created_at // "") | last // {}' \
                <<<"$status_json"
            )"
            status_state="$(
              jq -r '.state // "__MISSING__"' <<<"$commit_status" |
                tr '[:lower:]' '[:upper:]'
            )"
            status_url="$(
              jq -r '.target_url // empty' <<<"$commit_status"
            )"
            namesake_check_count="$(
              jq --arg n "$required_check" \
                '[.check_runs[] | select(.name == $n)] | length' \
                <<<"$check_runs_json"
            )"

            if [[ "$status_state" == "__MISSING__" ]]; then
              final_detail="required Commit Status is missing"
              if [[ "$namesake_check_count" -gt 0 ]]; then
                final_detail="$final_detail; namesake check run is not accepted"
              fi
              echo "MISSING: $required_check ($final_detail)"
              if [[ $SECONDS -ge $deadline ]]; then
                final_state="MISSING"
                break
              fi
              sleep "$sleep_seconds"
              continue
            fi

            case "$status_state" in
              SUCCESS)
                final_state="OK"
                final_detail="Commit Status state=success"
                ;;
              PENDING)
                echo "PENDING: $required_check (Commit Status state=pending)"
                if [[ $SECONDS -ge $deadline ]]; then
                  final_state="TIMEOUT"
                  final_detail="Commit Status remained pending"
                  break
                fi
                sleep "$sleep_seconds"
                continue
                ;;
              FAILURE|ERROR)
                final_state="FAILED"
                final_detail="Commit Status state=${status_state,,}"
                ;;
              *)
                final_state="FAILED"
                final_detail="unknown Commit Status state=$status_state"
                ;;
            esac
            if [[ -n "$status_url" ]]; then
              final_detail="$final_detail; url=$status_url"
            fi
            break
          done

          case "$final_state" in
            OK)
              echo "OK: $required_check ($final_detail)"
              ;;
            *)
              echo "::warning::$required_check -> $final_state ($final_detail)"
              ;;
          esac

          if [[ -n "$summary_file" ]]; then
            {
              echo "## Sentinel Summary"
              echo
              echo "- Mode: \`audit-only\`"
              echo "- SHA: \`$SHA\`"
              echo "- Required context: \`$required_check\`"
              echo "- Required type: \`$required_type\`"
              echo "- Result: \`$final_state\`"
              echo "- Detail: ${final_detail//|/\\|}"
              echo "- Check Runs are diagnostic only and cannot satisfy this Commit Status."
            } >> "$summary_file"
          fi

          echo "Sentinel completed in audit-only mode."
