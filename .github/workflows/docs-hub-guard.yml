name: Docs Hub Guard

# NOISE-FREEZE (#2613): auto-triggers disabled due to billing/account-locked
# RESTORED (#3659): billing recovery complete, triggers re-enabled
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Block runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning for runtime artifacts..."
          bad="$(
            {
              git ls-files | grep -E '(^|/)(__pycache__/|\.pytest_cache/|.*\.pyc$|.*\.pyo$|(^|/)logs/)' || true
              git ls-files | grep -E '.*\.log$' | grep -vE '^docs/runbooks/evidence/.*\.log$' || true
            } | sort -u
          )"
          if [ -n "$bad" ]; then
            echo "Found forbidden runtime artifacts tracked in git:"
            echo "$bad"
            exit 1
          fi

      - name: Basic secret pattern scan (best-effort)
        shell: bash
        run: |
          set -euo pipefail
          echo "Best-effort secret scan (patterns)."
          include_paths=(
            agents
            knowledge
            governance
            docs
          )
          git fetch origin main >/dev/null 2>&1 || true
          mapfile -t changed_files < <(git diff --name-only origin/main)
          scan_files=()
          for root in "${include_paths[@]}"; do
            for file in "${changed_files[@]}"; do
              if [[ "$file" == "$root"* ]]; then
                scan_files+=("$file")
              fi
            done
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "Keine Änderungen in den überwachten Ordnern; Secret-Scan übersprungen."
            exit 0
          fi
          # This lightweight guard is intentionally limited to credential-shaped
          # signatures. Generic words such as "secret", "token", and "api_key"
          # are normal vocabulary in security documentation and caused every
          # moved document to be treated as a leak. The dedicated gitleaks
          # workflows remain the canonical full-content and history scanners.
          credential_pattern='(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|xox[baprs]-[A-Za-z0-9-]{10,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})'
          hits="$(git grep -nEI "$credential_pattern" -- "${scan_files[@]}" || true)"
          if [ -n "$hits" ]; then
            echo "Potential secret-like strings found in geänderten Dateien (review required):"
            echo "$hits"
            echo ""
            echo "If these are false positives, adjust the workflow patterns or move values to local .env/.secrets."
            exit 1
          fi

      - name: Enforce canonical documentation and governance folders
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking canonical documentation and governance folders..."
          required_dirs=(
            agents
            docs
            knowledge
            knowledge/governance
            .github/governance
          )
          for d in "${required_dirs[@]}"; do
            if [ ! -d "$d" ]; then
              echo "Missing required canonical folder: $d"
              exit 1
            fi
          done

      - name: Block legacy split defaults in key entrypoints
        shell: bash
        run: |
          set -euo pipefail
          files=(
            README.md
            AGENTS.md
            docs/navigation/mcp-navpack/ENTRYPOINTS.yaml
            docs/navigation/mcp-navpack/CHEATSHEET.md
            docs/navigation/mcp-navpack/DOCS_HUB.pointer.md
          )
          hits="$(grep -nE '\.\./Claire_de_Binare_Docs|D:\\Dev\\Workspaces\\Repos\\Claire_de_Binare_Docs|canonical agent registry lives in the separate Docs Hub repo|Working Repo relies on the Docs Hub canonical registry' "${files[@]}" || true)"
          if [ -n "$hits" ]; then
            echo "Found stale split-repo defaults in key entrypoints:"
            echo "$hits"
            exit 1
          fi
