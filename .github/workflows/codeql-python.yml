name: CodeQL Python

# Repo-level CodeQL default setup owns SARIF upload for push/PR (#3670).
# This workflow keeps an advanced Python analysis path for validation without
# uploading SARIF while default setup is enabled.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # NOISE-FREEZE (#2613): push and pull_request auto-triggers disabled due to billing/account-locked
  # RESTORED (#3659): billing recovery complete, triggers re-enabled
  schedule:
    - cron: "21 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        with:
          languages: python
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v3
        with:
          category: "/language:python"
          upload: false
