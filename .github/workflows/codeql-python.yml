name: CodeQL Python

# Repo-level CodeQL default setup owns SARIF upload for push/PR (#3670).
# This workflow keeps an advanced Python analysis path for validation without
# uploading SARIF while default setup is enabled.
on:
  push:
    branches: [main]
  # #4401: PR trigger removed to cut hosted runner minutes on every synchronize.
  # Independent security value retained on every land-to-main + weekly schedule +
  # manual dispatch. Not equivalent to Fast-CI unit/lint (not moved to local).
  # NOISE-FREEZE (#2613) / RESTORED (#3659) history preserved above for audit.
  schedule:
    - cron: "21 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          languages: python
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          category: "/language:python"
          upload: false
