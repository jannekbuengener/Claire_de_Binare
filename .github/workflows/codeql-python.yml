name: CodeQL Python

# Repo-level CodeQL default setup owns SARIF upload for push/PR (#3670).
# This workflow keeps an advanced Python analysis path for validation without
# uploading SARIF while default setup is enabled.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # NOISE-FREEZE (#2613): push and pull_request auto-triggers disabled due to billing/account-locked
  # RESTORED (#3659): billing recovery complete, triggers re-enabled
  schedule:
    - cron: "21 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v3
        with:
          languages: python
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v3
        with:
          category: "/language:python"
          upload: false
