name: '🔍 Gemini Issue Assessment'

on:
  issues:
    types: [opened]

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  analyze:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    outputs:
      assessment: '${{ steps.read_assessment.outputs.assessment }}'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'read'
    steps:
      - name: 'Run Gemini issue assessment'
        id: 'gemini_analysis'
        uses: 'google-github-actions/run-gemini-cli@9dbec29a20fab3f35017a40ad0eb798a257d4d51' # ratchet:google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: '' # Do NOT pass any auth token here — runs on untrusted issue content
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
          ISSUE_TITLE: '${{ github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.issue.body }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-issue-assessment'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 20
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": [
                  "run_shell_command(echo)"
                ]
              }
            }
          prompt: '/gemini-issue-assessment'

      - name: 'Read assessment file into job output'
        id: 'read_assessment'
        run: |-
          if [[ -f /tmp/gemini-assessment.md ]] && [[ -s /tmp/gemini-assessment.md ]]; then
            {
              echo "assessment<<GEMINI_ASSESSMENT_EOF"
              cat /tmp/gemini-assessment.md
              echo "GEMINI_ASSESSMENT_EOF"
            } >> "${GITHUB_OUTPUT}"
          else
            echo "assessment=" >> "${GITHUB_OUTPUT}"
          fi

  comment:
    runs-on: 'ubuntu-latest'
    needs: ['analyze']
    if: "${{ needs.analyze.outputs.assessment != '' }}"
    permissions:
      contents: 'read'
      issues: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: '${{ vars.APP_ID }}'
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'

      - name: 'Post or update assessment comment'
        env:
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
          ASSESSMENT: '${{ needs.analyze.outputs.assessment }}'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7.0.1
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || github.token }}'
          script: |-
            const MARKER = '<!-- gemini-issue-assessment -->';
            const assessment = process.env.ASSESSMENT || '';
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);

            if (!assessment.trim()) {
              core.info('Assessment is empty — skipping comment.');
              return;
            }

            const body = `${MARKER}\n${assessment}`;

            // Check for an existing assessment comment to avoid duplicates
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              core.info(`Updating existing assessment comment (id: ${existing.id})`);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              core.info('Creating new assessment comment');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
