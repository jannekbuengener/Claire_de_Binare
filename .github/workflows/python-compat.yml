name: python-compat

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  # NOISE-FREEZE (#2613): push auto-trigger disabled due to billing/account-locked
  # non-required check noise. Scheduled and manual runs remain available.

permissions:
  contents: read

jobs:
  compat:
    name: Python compatibility matrix (informational)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    continue-on-error: ${{ contains(fromJson('["3.13","3.14"]'), matrix.python-version) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Quick compatibility smoke
        run: python -c "import sys; print(sys.version)"
