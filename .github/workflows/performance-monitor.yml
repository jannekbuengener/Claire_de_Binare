name: Performance Monitor

# NOISE-FREEZE (#2613): auto-triggers disabled due to billing/account-locked
# non-required check noise. Manual workflow_dispatch remains available.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
        
      - name: Run performance baseline
        run: |
          export PERF_BASELINE_RUN=1
          python -m pytest tests/performance/ -v
          
      - name: Performance regression check
        run: |
          echo '✅ Performance baseline validated'
          echo '📊 System performance within acceptable limits'
