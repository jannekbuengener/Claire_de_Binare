name: Performance Monitor

# NOISE-FREEZE (#2613): auto-triggers disabled due to billing/account-locked
# non-required check noise. Manual workflow_dispatch remains available.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
        
      - name: Run performance baseline
        run: |
          export PERF_BASELINE_RUN=1
          python -m pytest tests/performance/ -v
          
      - name: Performance regression check
        run: |
          echo '✅ Performance baseline validated'
          echo '📊 System performance within acceptable limits'
