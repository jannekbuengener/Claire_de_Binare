# LEGACY / QUARANTINED — DO NOT USE as operator start path
# Issue #4120 Decision: RETIRE_QUARANTINE
#
# Claire de Binare - TLS Overlay (historical reference only)
# Originally: Issue #103 TLS/SSL Implementation
#
# Status: LEGACY. Not part of the canonical BLUE+RED runtime.
# Canonical start: compose.blue.yml + compose.red.yml (no tls.yml).
# Secrets canon remains ${SECRETS_PATH} (default ~/Documents/.secrets/.cdb).
# The historical .cdb_local/tls bind mounts below are NOT the secrets canon
# and must not be used as a supported operator path.
#
# DO NOT:
#   docker compose -f .../compose.blue.yml -f .../tls.yml up -d
#
# Historical intent (archived):
# - Redis TLS / PostgreSQL SSL overlay experiments
# - Certificate mounts under ../../../../../.cdb_local/tls
#
# See: infrastructure/tls/TLS_SETUP.md (quarantined guide)

services:
  cdb_redis:
    # Override command to enable TLS
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass $${REDIS_PASSWORD}
      --tls-port 6379
      --port 0
      --tls-cert-file /tls/redis.crt
      --tls-key-file /tls/redis.key
      --tls-ca-cert-file /tls/ca.crt
      --tls-auth-clients optional
      --tls-replication yes
    volumes:
      - redis_data:/data
      - ../../../../../.cdb_local/tls:/tls:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli --tls --cert /tls/client.crt --key /tls/client.key --cacert /tls/ca.crt -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  cdb_postgres:
    # PostgreSQL SSL configuration via environment and mounted config
    environment:
      POSTGRES_DB: claire_de_binare
      POSTGRES_USER: ${POSTGRES_USER:-claire_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../../infrastructure/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../infrastructure/database/migrations/002_orders_price_nullable.sql:/docker-entrypoint-initdb.d/02-migration-002.sql:ro
      - ../../infrastructure/database/migrations/004_governance_v0.sql:/docker-entrypoint-initdb.d/04-migration-004.sql:ro
      - ../../infrastructure/database/migrations/011_trade_realized_pnl.sql:/docker-entrypoint-initdb.d/11-migration-011.sql:ro
      # TLS certificates
      - ../../../../../.cdb_local/tls/postgres.crt:/var/lib/postgresql/server.crt:ro
      - ../../../../../.cdb_local/tls/postgres.key:/var/lib/postgresql/server.key:ro
      - ../../../../../.cdb_local/tls/ca.crt:/var/lib/postgresql/root.crt:ro
      # SSL configuration script
      - ../../infrastructure/tls/postgres_ssl_init.sh:/docker-entrypoint-initdb.d/00-ssl-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claire_user} -d claire_de_binare"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Application services with TLS client configuration
  cdb_ws:
    environment:
      REDIS_TLS: "true"
      REDIS_CA_CERT: /tls/ca.crt
      POSTGRES_SSLMODE: verify-ca
      POSTGRES_SSLROOTCERT: /tls/ca.crt
    volumes:
      - ../../../../../.cdb_local/tls:/tls:ro

  cdb_signal:
    environment:
      REDIS_TLS: "true"
      REDIS_CA_CERT: /tls/ca.crt
      POSTGRES_SSLMODE: verify-ca
      POSTGRES_SSLROOTCERT: /tls/ca.crt
    volumes:
      - ../../../../../.cdb_local/tls:/tls:ro

  cdb_risk:
    environment:
      REDIS_TLS: "true"
      REDIS_CA_CERT: /tls/ca.crt
      POSTGRES_SSLMODE: verify-ca
      POSTGRES_SSLROOTCERT: /tls/ca.crt
    volumes:
      - ../../../../../.cdb_local/tls:/tls:ro

  cdb_execution:
    environment:
      REDIS_TLS: "true"
      REDIS_CA_CERT: /tls/ca.crt
      POSTGRES_SSLMODE: verify-ca
      POSTGRES_SSLROOTCERT: /tls/ca.crt
    volumes:
      - ../../../../../.cdb_local/tls:/tls:ro

  cdb_db_writer:
    environment:
      REDIS_TLS: "true"
      REDIS_CA_CERT: /tls/ca.crt
      POSTGRES_SSLMODE: verify-ca
      POSTGRES_SSLROOTCERT: /tls/ca.crt
    volumes:
      - ../../../../../.cdb_local/tls:/tls:ro
