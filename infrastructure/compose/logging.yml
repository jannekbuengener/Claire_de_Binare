# Logging Overlay - Loki + Promtail + Alertmanager
# Add centralized log aggregation and alert routing to the stack
# Usage: Automatically included when stack_up.ps1 is called with -Logging flag

services:
  cdb_alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cdb_alertmanager
    restart: unless-stopped
    secrets:
      - smtp_user
      - smtp_password
      - smtp_from
      - alert_email_to
    entrypoint:
      - "/bin/sh"
      - "-c"
      - >
        sed
        -e "s|__SMTP_USER__|$$(cat /run/secrets/smtp_user)|g"
        -e "s|__SMTP_PASSWORD__|$$(cat /run/secrets/smtp_password)|g"
        -e "s|__SMTP_FROM__|$$(cat /run/secrets/smtp_from)|g"
        -e "s|__ALERT_EMAIL_TO__|$$(cat /run/secrets/alert_email_to)|g"
        /etc/alertmanager/alertmanager.yml > /tmp/am.yml
        && exec /bin/alertmanager --config.file=/tmp/am.yml --storage.path=/alertmanager
    volumes:
      - ../../infrastructure/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - cdb_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - cdb_prometheus

  cdb_loki:
    image: grafana/loki:2.9.3
    container_name: cdb_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../../infrastructure/monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - cdb_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cdb_promtail:
    image: grafana/promtail:2.9.3
    container_name: cdb_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../../infrastructure/monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cdb_network
    depends_on:
      cdb_loki:
        condition: service_healthy

volumes:
  loki_data:
    driver: local
  alertmanager_data:
    driver: local
