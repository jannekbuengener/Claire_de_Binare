# Claire de Binare - AlertManager Configuration
# Issue #96: Monitoring & Alerting
#
# SMTP credentials injected at runtime via sed substitution (logging.yml entrypoint).
# Placeholders: __SMTP_USER__, __SMTP_PASSWORD__, __SMTP_FROM__, __ALERT_EMAIL_TO__
# Source secrets: compose.red.yml (smtp_user, smtp_password, smtp_from, alert_email_to)

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '__SMTP_FROM__'
  smtp_auth_username: '__SMTP_USER__'
  smtp_auth_password: '__SMTP_PASSWORD__'
  smtp_require_tls: true

# Route tree
route:
  # Default receiver
  receiver: 'default-receiver'

  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'service']

  # Wait before sending first notification
  group_wait: 1m

  # Wait before sending subsequent notifications
  group_interval: 10m

  # Wait before sending resolved notification
  repeat_interval: 6h

  # Child routes for specific severities
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # High priority alerts
    - match:
        severity: high
      receiver: 'high-priority-receiver'
      group_wait: 1m
      repeat_interval: 2h

    # Circuit breaker specific
    - match:
        alertname: CircuitBreakerTriggered
      receiver: 'trading-halt-receiver'
      group_wait: 0s
      repeat_interval: 30m

# Inhibition rules - prevent notification floods
inhibit_rules:
  # If service is down, suppress all other alerts for that service
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.+'
    equal: ['service']

  # If database is down, suppress order processing alerts
  - source_match:
      alertname: 'DatabaseConnectionLost'
    target_match:
      alertname: 'OrderProcessingDelayed'

  # If critical alert fires, suppress warnings for same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['service']

# Receivers
receivers:
  - name: 'default-receiver'
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        send_resolved: true

  - name: 'critical-receiver'
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        send_resolved: true

  - name: 'high-priority-receiver'
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        send_resolved: true

  - name: 'trading-halt-receiver'
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        send_resolved: true

# Templates (optional)
templates:
  - '/etc/alertmanager/templates/*.tmpl'
